<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Atelier</title>
  <desc id="desc">Three specimens of the same plot in Atelier's Instrument, Editorial and Console visual directions.</desc>
  <defs>
    <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#201e33"/><stop offset="1" stop-color="#141b28"/></linearGradient>
    <path id="trace" d="M0 45 12 39 24 42 36 25 48 29 60 11 72 19 84 8 96 12 108 2"/>
    <path id="guides" d="M0 4h108 M0 25h108 M0 46h108"/>
