    <text x="92" y="77" font-size="15" letter-spacing="1.8" fill="#d0c9e1">INTERFACE KIT / PROJECT GENERATOR</text>
    <text x="51" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="101" letter-spacing="-5" fill="#f7f2e9">atelier</text>
    <text x="56" y="228" font-size="30" letter-spacing="-.7" fill="#e3dfeb">Build the screen your work needs.</text>
    <text x="56" y="322" font-size="16" fill="#c3bdcb">Review stations · Monitors · Labs · Reports</text>
    <text x="627" y="74" font-size="15" letter-spacing="1.6" fill="#c9c5d5">ONE FIGURE, THREE DIRECTIONS</text>
    <g transform="translate(627 105)">
