      <g transform="translate(27 77)"><use href="#guides" fill="none" stroke="#ddd1b8"/><use href="#trace" fill="none" stroke="#925126" stroke-width="2.6"/><circle cx="108" cy="2" r="3.5" fill="#925126"/></g>
      <path d="M26 151h108" stroke="#a59a83"/><path d="M26 151v4m54 -4v4m54 -4v4" stroke="#a59a83"/>
