      <path d="M0 43h164" stroke="#c1cbd4"/>
      <rect x="16" y="20" width="9" height="9" rx="2" fill="#315bc7"/>
      <text x="34" y="30" font-size="18" font-weight="700" fill="#1c2c3a">Instrument</text>
      <g transform="translate(27 77)"><use href="#guides" fill="none" stroke="#d3dce6"/><use href="#trace" stroke="#315bc7" stroke-width="3" fill="none" stroke-linejoin="round"/><circle cx="108" cy="2" r="3.5" fill="#315bc7"/></g>
      <path d="M26 151h108" stroke="#b6c3d1"/><path d="M26 151v4m54 -4v4m54 -4v4" stroke="#8197a6"/>
    </g>
    <g transform="translate(807 105)">
