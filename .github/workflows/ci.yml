name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, types and colours
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: npm ci
      - run: npx biome ci
      - run: npm run typecheck
      - run: node template/scripts/check-colours.mjs packages/kit/src
      - run: node template/scripts/check-inert-buttons.mjs packages/kit/src apps/gallery/src
      - run: node template/scripts/check-type-scale.mjs packages/kit/src apps/gallery/src
      - run: node --test packages/kit/test/*.test.ts
      - run: uvx zizmor@1.31.1 .github/workflows template/.github/workflows

  gallery:
    name: gallery screenshots and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: every direction, mode and screen
        working-directory: apps/gallery
        run: |
          THEME=all npx vite build --outDir dist/board
          npx vite preview --outDir dist/board --port 5188 --strictPort &
          until curl -sf http://localhost:5188/ > /dev/null; do sleep 1; done
          node scripts/capture.mjs http://localhost:5188 captures
      - name: as a claude.ai artifact
        working-directory: apps/gallery
        run: |
          npm run build:artifact
          node scripts/check-artifact.mjs
      # Screenshots help review, but a full artifact quota must not fail the run.
      - name: keep the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-screenshots
          path: apps/gallery/captures/
          if-no-files-found: ignore
          retention-days: 7

  generated:
    name: generate ${{ matrix.kind }} (${{ matrix.theme }}) and run its gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: monitor, theme: instrument, extra: "" }
          - { kind: review, theme: editorial, extra: "" }
          - { kind: lab, theme: console, extra: "" }
          - { kind: report, theme: instrument, extra: "--no-artifact --visibility public" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: generate and check
        env:
          KIND: ${{ matrix.kind }}
          THEME_NAME: ${{ matrix.theme }}
          EXTRA: ${{ matrix.extra }}
        # EXTRA holds fixed flags from the matrix above, split on purpose.
        run: node scripts/try-template.mjs --kind "$KIND" --theme "$THEME_NAME" $EXTRA
